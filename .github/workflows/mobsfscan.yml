name: mobsfscan

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

jobs:
  mobile-audit:
    name: "Trigger Mobile Audit" # modify to suit project name
    # uses: Xttreme/cross-github-actions/.github/workflows/mobile-scan.yaml@main
    # with:
    runs-on: ubuntu-latest
    # secrets: inherit

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Create or update .mobsf config to filter only ERROR severity
        run: |
          echo "severity-filter:" > .mobsf
          echo "  - ERROR" >> .mobsf
          echo "ignore-rules:" >> .mobsf
          echo "  - android_kotlin_hiddenui" >> .mobsf
          echo "  - android_task_hijacking1" >> .mobsf
          echo "  - android_task_hijacking2" >> .mobsf

      # - name: Generate mobile app scan report
      #   uses: MobSF/mobsfscan@3d87bc570c4614d705547bddb521395663dba353
      #   continue-on-error: true #temporary fail open
      #   with:
      #     args: '. --json --output mobsf-report.json'

      # - name: Mobile App Scan
      #   continue-on-error: true #temporary fail open
      #   if: always()
      #   uses: MobSF/mobsfscan@3d87bc570c4614d705547bddb521395663dba353
      #   with:
      #     args: ${{ inputs.args }}

      - name: Mobile App Scan
        shell: bash
        run: |
          docker pull opensecurity/mobsfscan@sha256:520b572b6d77333266109d873961029e06c83d5c2d7585ef346f433d4b9911ab
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            opensecurity/mobsfscan@sha256:520b572b6d77333266109d873961029e06c83d5c2d7585ef346f433d4b9911ab /src 

      - name: Generate mobile app scan report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          docker pull opensecurity/mobsfscan@sha256:520b572b6d77333266109d873961029e06c83d5c2d7585ef346f433d4b9911ab
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            opensecurity/mobsfscan@sha256:520b572b6d77333266109d873961029e06c83d5c2d7585ef346f433d4b9911ab \
            /src --json --output /src/mobsf-report.json || true

      - name: Display mobile app scan report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f mobsf-report.json ]; then
            echo "=== MobSF Scan Report ==="
            cat mobsf-report.json
          else
            echo "mobsf-report.json not found!"
          fi

